name: NX Hi-Fi
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake make zip g++
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm switch-dev switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-cmake
      - name: Host regression tests
        run: |
          chmod +x build-switch.sh scripts/test-host.sh
          CC=gcc CXX=g++ ./scripts/test-host.sh
      - name: Build Switch application
        run: ./build-switch.sh
      - name: Verify and package
        run: |
          test -s sd-card/switch/nx-hifi/nx-hifi.nro
          test -s sd-card/switch/nx-hifi/config.example.json
          cp README.md sd-card/README.md
          cd sd-card
          zip -r ../NX-Hi-Fi-v0.9.0-Switch.zip switch README.md
      - uses: actions/upload-artifact@v4
        with:
          name: NX-Hi-Fi-v0.9.0-Switch
          path: NX-Hi-Fi-v0.9.0-Switch.zip
          if-no-files-found: error
